<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Латинский язык: лексический минимум №4</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 16px 48px}

.card,.item{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:22px 20px}.card{min-height:260px;display:flex;flex-direction:column;gap:14px;cursor:pointer}.tag{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.word{font-size:1.55rem;font-weight:750}.latin{font-size:1.45rem;font-weight:750;color:var(--accent)}.hint{margin-top:auto;color:var(--muted);font-size:.88rem}.note{padding:9px 11px;background:var(--soft);border-radius:9px;font-size:.9rem}

.progress{margin-bottom:12px}.track{height:7px;background:var(--line);border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--ok)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:6px}.reset{border:0;background:none;color:var(--accent)}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);font-size:1rem;margin-bottom:12px}.list{display:flex;flex-direction:column;gap:9px}.item h3{margin:0 0 6px}.item p{margin:0}.item b{color:var(--accent)}.section{margin:18px 2px 8px}
</style></head><body><div class="wrap"><h1>Латинский язык: лексический минимум № 4</h1><p class="sub">Существительные и прилагательные 1-й группы · 52 слов</p>
<div class="tabs"><button data-m="cards">Карточки</button><button data-m="cloze">Пропуски</button><button data-m="list">Шпаргалка</button></div><main id="view"></main></div>
<script>
const D=[{"section": "Существительные", "ru": "задний проход", "f1": "anus", "f2": "i", "f3": "m", "full": "anus, i m", "note": ""}, {"section": "Существительные", "ru": "апертура / отверстие", "f1": "apertura", "f2": "ae", "f3": "f", "full": "apertura, ae f", "note": ""}, {"section": "Существительные", "ru": "слепая кишка", "f1": "caecum", "f2": "i", "f3": "n", "full": "caecum, i n", "note": ""}, {"section": "Существительные", "ru": "ободочная кишка", "f1": "colon", "f2": "coli", "f3": "n", "full": "colon, coli n", "note": ""}, {"section": "Существительные", "ru": "конъюнктива", "f1": "conjunctīva", "f2": "ae", "f3": "f", "full": "conjunctīva, ae f", "note": ""}, {"section": "Существительные", "ru": "коронка (зуба)", "f1": "corōna", "f2": "ae", "f3": "f", "full": "corōna, ae f", "note": ""}, {"section": "Существительные", "ru": "толстая кишка", "f1": "crassum", "f2": "i", "f3": "n", "full": "crassum, i n", "note": ""}, {"section": "Существительные", "ru": "зуб", "f1": "dens", "f2": "dentis", "f3": "m", "full": "dens, dentis m", "note": ""}, {"section": "Существительные", "ru": "двенадцатиперстная кишка", "f1": "duodēnum", "f2": "i", "f3": "n", "full": "duodēnum, i n", "note": ""}, {"section": "Существительные", "ru": "изгиб", "f1": "flexura", "f2": "ae", "f3": "f", "full": "flexura, ae f", "note": ""}, {"section": "Существительные", "ru": "дно", "f1": "fundus", "f2": "i", "f3": "m", "full": "fundus, i m", "note": ""}, {"section": "Существительные", "ru": "подвздошная кишка", "f1": "ileum", "f2": "i", "f3": "n", "full": "ileum, i n", "note": ""}, {"section": "Существительные", "ru": "кишка", "f1": "intestīnum", "f2": "i", "f3": "n", "full": "intestīnum, i n", "note": ""}, {"section": "Существительные", "ru": "тощая кишка", "f1": "jejūnum", "f2": "i", "f3": "n", "full": "jejūnum, i n", "note": ""}, {"section": "Существительные", "ru": "доля", "f1": "lobus", "f2": "i", "f3": "m", "full": "lobus, i m", "note": ""}, {"section": "Существительные", "ru": "брыжейка", "f1": "mesenterium", "f2": "i", "f3": "n", "full": "mesenterium, i n", "note": ""}, {"section": "Существительные", "ru": "слизистая (оболочка)", "f1": "mucosa", "f2": "ae", "f3": "f", "full": "mucosa, ae f", "note": ""}, {"section": "Существительные", "ru": "пищевод", "f1": "oesophăgus", "f2": "i", "f3": "m", "full": "oesophăgus, i m", "note": ""}, {"section": "Существительные", "ru": "сальник", "f1": "omentum", "f2": "i", "f3": "n", "full": "omentum, i n", "note": ""}, {"section": "Существительные", "ru": "яичник", "f1": "ovarium", "f2": "i", "f3": "n", "full": "ovarium, i n", "note": ""}, {"section": "Существительные", "ru": "промежность", "f1": "perinēum", "f2": "i", "f3": "n", "full": "perinēum, i n", "note": ""}, {"section": "Существительные", "ru": "брюшина", "f1": "peritonēum", "f2": "i", "f3": "n", "full": "peritonēum, i n", "note": ""}, {"section": "Существительные", "ru": "сплетение", "f1": "plexus", "f2": "us", "f3": "m", "full": "plexus, us m", "note": ""}, {"section": "Существительные", "ru": "привратник", "f1": "pylōrus", "f2": "i", "f3": "m", "full": "pylōrus, i m", "note": ""}, {"section": "Существительные", "ru": "ветвь", "f1": "ramus", "f2": "i", "f3": "m", "full": "ramus, i m", "note": ""}, {"section": "Существительные", "ru": "прямая кишка", "f1": "rectum", "f2": "i", "f3": "n", "full": "rectum, i n", "note": ""}, {"section": "Существительные", "ru": "пространство / промежуток", "f1": "spatium", "f2": "i", "f3": "n", "full": "spatium, i n", "note": ""}, {"section": "Существительные", "ru": "слой", "f1": "stratum", "f2": "i", "f3": "n", "full": "stratum, i n", "note": ""}, {"section": "Существительные", "ru": "ствол / туловище", "f1": "truncus", "f2": "i", "f3": "m", "full": "truncus, i m", "note": ""}, {"section": "Существительные", "ru": "оболочка", "f1": "tunĭca", "f2": "ae", "f3": "f", "full": "tunĭca, ae f", "note": ""}, {"section": "Существительные", "ru": "матка", "f1": "utĕrus", "f2": "i", "f3": "m", "full": "utĕrus, i m", "note": ""}, {"section": "Существительные", "ru": "влагалище", "f1": "vagīna", "f2": "ae", "f3": "f", "full": "vagīna, ae f", "note": ""}, {"section": "Существительные", "ru": "желудочек / желудок", "f1": "ventriculus", "f2": "i", "f3": "m", "full": "ventriculus, i m", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "клыковый (зуб, клык)", "f1": "caninus", "f2": "a", "f3": "um", "full": "caninus, a, um", "note": "буквально: собачий"}, {"section": "Прилагательные 1-й группы", "ru": "молочный (зуб)", "f1": "deciduus", "f2": "a", "f3": "um", "full": "deciduus, a, um", "note": "буквально: отпадающий"}, {"section": "Прилагательные 1-й группы", "ru": "желудочный", "f1": "gastricus", "f2": "a", "f3": "um", "full": "gastricus, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "ягодичный", "f1": "glutēus", "f2": "a", "f3": "um", "full": "glutēus, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "подъязычный (кость, связка)", "f1": "hyoideus", "f2": "a", "f3": "um", "full": "hyoideus, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "подъязычный (нерв)", "f1": "hypoglossus", "f2": "a", "f3": "um", "full": "hypoglossus, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "резцовый", "f1": "incisīvus", "f2": "a", "f3": "um", "full": "incisīvus, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "межзапястный", "f1": "intercarpēus", "f2": "a", "f3": "um", "full": "intercarpēus, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "межпоперечный", "f1": "intertransversarius", "f2": "a", "f3": "um", "full": "intertransversarius, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "лимфатический", "f1": "lymphaticus", "f2": "a", "f3": "um", "full": "lymphaticus, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "слизистый", "f1": "mucоsus", "f2": "a", "f3": "um", "full": "mucоsus, a, um", "note": ""}, {"section": "Прилагательные 1-й группы", "ru": "зрител const load=(k,d)=>{try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let mode=load("lat4-mode","cards"),known=new Set(load("lat4-known",[])),queue=[],pos=0,flip=false,ci=0,q="";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function build(){queue=D.map((_,i)=>i).filter(i=>!known.has(i));pos=0;flip=false}
function tabs(){document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===mode))}
function prog(){let k=known.size;return `<div class="progress"><div class="meta"><span>Запомнено ${k} из ${D.length}</span><button class="reset" id="reset">Начать заново</button></div><div class="track"><div class="fill" style="width:${k/D.length*100}%"></div></div></div>`}
function render(){tabs();mode==="cards"?cards():mode==="cloze"?cloze():list();let r=$("#reset");if(r)r.onclick=()=>{known.clear();save("lat4-known",[]);build();render()}}
function cards(){if(!queue.length){view.innerHTML=prog()+`<div class="card"><div class="word">Все карточки выучены ✓</div></div>`;return}let ix=queue[pos],d=D[ix];
view.innerHTML=prog()+`<div class="card" id="card"><span class="tag">${esc(d.section)} · осталось ${queue.length}</span><div class="word">${esc(d.ru)}</div>${flip?`<div class="latin">${esc(d.full)}</div>${d.note?`<div class="note">${esc(d.note)}</div>`:""}`:`<div class="hint">Вспомни латинскую форму и нажми на карточку.</div>`}</div>`+(flip?`<div class="actions"><button class="btn again" id="again">Ещё раз</button><button class="btn know" id="know">Помню</button></div>`:`<div class="actions"><button class="btn" id="skip">Пропустить</button><button class="btn" id="show">Показать</button></div>`);
let f=()=>{if(!flip){flip=true;cards()}};$("#card").onclick=f;if(flip){$("#know").onclick=()=>{known.add(ix);save("lat4-known",[...known]);queue.splice(pos,1);if(pos>=queue.length)pos=0;flip=false;cards()};$("#again").onclick=()=>{queue.push(queue.splice(pos,1)[0]);flip=false;cards()}}else{$("#show").onclick=f;$("#skip").onclick=()=>{queue.push(queue.splice(pos,1)[0]);cards()}}}
function cloze(){let d=D[ci];view.innerHTML=`<p class="tips">Дано слово по-русски. Открывай формы строго по порядку: первая → вторая → третья.</p><div class="card" style="cursor:default"><span class="tag">${esc(d.section)} · ${ci+1} из ${D.length}</span><div class="word">${esc(d.ru)}</div><div class="forms"><button class="blank">${esc(d.f1)}</button><button class="blank lock">${esc(d.f2)}</button><button class="blank lock">${esc(d.f3)}</button></div>${d.note?`<div class="note">${esc(d.note)}</div>`:""}<div class="hint">Нажми на первый пропуск, затем на второй и третий.</div></div><div class="actions"><button class="btn" id="prev">← Назад</button><button class="btn know" id="next">Дальше →</button></div>`;
let bs=[...document.querySelectorAll(".blank")],opened=0;bs.forEach((b,j)=>b.onclick=()=>{if(j===opened){b.classList.add("open");b.classList.remove("lock");opened++;if(bs[opened])bs[opened].classList.remove("lock")}});$("#next").onclick=()=>{ci=(ci+1)%D.length;cloze()};$("#prev").onclick=()=>{ci=(ci-1+D.length)%D.length;cloze()}}
function list(){view.innerHTML=`<input class="search" id="search" placeholder="Поиск по русскому или латинскому…" value="${esc(q)}"><div class="list" id="lst"></div>`;const draw=()=>{let t=q.toLowerCase().trim(),a=D.filter(d=>!t||(d.ru+" "+d.full).toLowerCase().includes(t)),last="";$("#lst").innerHTML=a.map(d=>{let h=d.section!==last?`<h2 class="section">${esc(d.section)}</h2>`:"";last=d.section;return h+`<article class="item"><h3>${esc(d.ru)}</h3><p><b>${esc(d.full)}</b></p>${d.note?`<div class="note">${esc(d.note)}</div>`:""}</article>`}).join("")};$("#search").oninput=e=>{q=e.target.value;draw()};draw()}
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;save("lat4-mode",mode);render()});build();render();
</script></body></html>
